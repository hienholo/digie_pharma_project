name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'pharmacie_back/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pharmacie_back/**'

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: backend
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────
  # 1. BUILD & TESTS
  # ───────────────────────────────────────────
  build-test:
    name: Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests
        working-directory: ./pharmacie_back
        run: mvn clean verify --no-transfer-progress

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: pharmacie_back/target/surefire-reports/
          retention-days: 7

  # ───────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH → GHCR
  # ───────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pharmacie_back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────
  # 3. DÉPLOIEMENT SUR VPS
  # ───────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "── Pulling latest image ──"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/backend:latest

            echo "── Restarting container ──"
            docker stop backend || true
            docker rm   backend || true
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SERVER_PORT=8080 \
              --env-file /opt/app/.env \
              ghcr.io/${{ github.repository_owner }}/backend:latest

            echo "── Cleanup old images ──"
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "── Waiting for backend to be ready ──"
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "✅ Backend is up!"
                exit 0
              fi
              echo "Attempt $i/12 — retrying in 5s..."
              sleep 5
            done
            echo "❌ Health check failed"
            exit 1
