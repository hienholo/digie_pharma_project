name: Backend CI/CD

on:
  push:
    branches: [develop]
    paths:
      - 'pharmacie_back/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'pharmacie_back/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: backend
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────
  # 1. BUILD
  # ───────────────────────────────────────────
  build-test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build
        working-directory: ./pharmacie_back
        run: mvn clean package -DskipTests --no-transfer-progress

  # ───────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH → GHCR
  # ───────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./pharmacie_back
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ───────────────────────────────────────────
  # 3. DÉPLOIEMENT — self-hosted runner (VPS)
  # ───────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull & restart backend
        run: |
          docker pull ghcr.io/hienholo/backend:latest
          docker stop backend || true
          docker rm   backend || true
          docker run -d \
            --name backend \
            --restart unless-stopped \
            -p 8080:8080 \
            -e SERVER_PORT=8080 \
            --env-file /opt/app/.env \
            ghcr.io/hienholo/backend:latest
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ Backend is up!"
              exit 0
            fi
            echo "Attempt $i/12 — retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1
