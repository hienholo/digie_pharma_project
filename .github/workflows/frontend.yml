name: Frontend CI/CD

on:
  push:
    branches: [develop]
    paths:
      - 'pharmacie_front/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'pharmacie_front/**'

env:
  NODE_VERSION: '20'
  IMAGE_NAME: frontend
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────
  # 1. BUILD
  # ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: pharmacie_front/package-lock.json

      - name: Install dependencies
        working-directory: ./pharmacie_front
        run: npm ci --silent

      - name: Build production bundle
        working-directory: ./pharmacie_front
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: pharmacie_front/dist/
          retention-days: 1

  # ───────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH → GHCR
  # ───────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./pharmacie_front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_API_BASE_URL=/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────
  # 3. DÉPLOIEMENT SUR VPS
  # ───────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "── Pulling latest image ──"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/frontend:latest

            echo "── Restarting container ──"
            docker stop frontend || true
            docker rm   frontend || true
            docker run -d \
              --name frontend \
              --restart unless-stopped \
              -p 3000:80 \
              ghcr.io/${{ github.repository_owner }}/frontend:latest

            echo "── Cleanup old images ──"
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            for i in $(seq 1 10); do
              if curl -sf http://localhost:3000; then
                echo "✅ Frontend is up!"
                exit 0
              fi
              echo "Attempt $i/10 — retrying in 5s..."
              sleep 5
            done
            echo "❌ Health check failed"
            exit 1
