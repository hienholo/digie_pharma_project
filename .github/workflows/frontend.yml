name: Frontend CI/CD

on:
  push:
    branches: [develop]
    paths:
      - 'pharmacie_front/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'pharmacie_front/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  IMAGE_NAME: frontend
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────────────────────
  # 1. BUILD
  # ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pharmacie_front/package-lock.json

      - name: Install dependencies
        working-directory: ./pharmacie_front
        run: npm ci --silent

      - name: Build production bundle
        working-directory: ./pharmacie_front
        run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1

  # ───────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH → GHCR
  # ───────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./pharmacie_front
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_API_BASE_URL=/api/v1

  # ───────────────────────────────────────────
  # 3. DÉPLOIEMENT — self-hosted runner (VPS)
  # ───────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: docker
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull & restart frontend
        run: |
          docker pull ghcr.io/hienholo/frontend:latest
          docker stop frontend || true
          docker rm   frontend || true
          docker run -d \
            --name frontend \
            --restart unless-stopped \
            -p 3000:80 \
            ghcr.io/hienholo/frontend:latest
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000; then
              echo "✅ Frontend is up!"
              exit 0
            fi
            echo "Attempt $i/10 — retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1
